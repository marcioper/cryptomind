version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cryptomind-postgres
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  recommendation-service:
    build: ./recommendation-service
    container_name: cryptomind-recommendation
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://postgres:pass1234@postgres:5432/cryptomind
      - BINANCE_KLINES_BASE_URL=https://api.binance.com
      - DEFAULT_SYMBOL=BTCUSDT
      - BACKFILL_DAYS=90
    ports:
      - "8000:8000"
    volumes:
      - model_artifacts:/app/artifacts

  user-service:
    build: ./user-service
    container_name: cryptomind-user
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    ports:
      - "8080:8080"

  portfolio-service:
    build: ./portfolio-service
    container_name: cryptomind-portfolio
    depends_on:
      postgres:
        condition: service_healthy
      recommendation-service:
        condition: service_started
    env_file:
      - ./.env
      - ./portfolio-service/.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cryptomind
      - RECOMMENDATION_BASE_URL=http://recommendation-service:8000
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8081/api/portfolio
        NEXT_PUBLIC_BOT_API_BASE: http://localhost:8081/api/bot
    container_name: cryptomind-frontend
    depends_on:
      - portfolio-service
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8081/api/portfolio
      - NEXT_PUBLIC_BOT_API_BASE=http://localhost:8081/api/bot
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  model_artifacts:
